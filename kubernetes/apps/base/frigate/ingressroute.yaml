apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: frigate-insecure
  namespace: frigate
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate
  namespace: frigate
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`frigate.internal.gogov.dev`)
      kind: Rule
      services:
        - name: frigate
          port: 8971
          scheme: https
          serversTransport: frigate-insecure
  tls: {}