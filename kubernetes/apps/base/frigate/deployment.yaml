apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-node-3
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:0.18.2-cfa08c5
          imagePullPolicy: Always
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: Europe/Sofia
            - name: CONFIG_FILE
              value: /config/config.yaml
          envFrom:
            - secretRef:
                name: frigate-env
          ports:
            - name: https
              containerPort: 8971
          startupProbe:
            httpGet: {path: /api/version, port: 5000}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /api/version, port: 5000}
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: cfg,    mountPath: /cfg, readOnly: true}
            - {name: media,  mountPath: /media/frigate}
            - {name: dri,    mountPath: /dev/dri}
            - {name: shm,    mountPath: /dev/shm}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: frigate-config}
        - name: media
          hostPath: {path: /mnt/frigate-storage, type: Directory}
        - name: cfg
          configMap: {name: frigate-config}
        - name: dri
          hostPath: {path: /dev/dri, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}

---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: frigate
spec:
  selector:
    app: frigate
  ports:
    - name: https
      port: 8971
      targetPort: 8971