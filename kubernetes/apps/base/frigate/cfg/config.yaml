mqtt:
  enabled: false

detectors:
  ov:
    type: cpu
    num_threads: 1

record:
  enabled: true
  continuous:
    days: 0        # no 24/7 recording
  motion:
    days: 3        # old retain.days: 3 + mode: motion
  alerts:
    retain:
      days: 14
      mode: active_objects
  detections:
    retain:
      days: 14
      mode: active_objects

snapshots:
  enabled: true
  retain:
    default: 14

detect:
  enabled: true

cameras:
  yard:
    ffmpeg:
      inputs:
        # Substream: detection
        - path: rtsp://admin:{FRIGATE_YARD_PASSWORD}@192.168.0.202:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect

        # Main stream: recording
        - path: rtsp://admin:{FRIGATE_YARD_PASSWORD}@192.168.0.202:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record

    detect:
      width: 704
      height: 576
      fps: 3

    objects:
      track:
        - person
        - dog

  gate:
    ffmpeg:
      inputs:
        # Substream: detection
        - path: rtsp://admin:{FRIGATE_GATE_PASSWORD}@192.168.0.201:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect

        # Main stream: recording
        - path: rtsp://admin:{FRIGATE_GATE_PASSWORD}@192.168.0.201:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record

    detect:
      width: 704
      height: 576
      fps: 3

    objects:
      track:
        - person
        - dog
version: 0.18-0
