apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.sops.yaml
  - deployment.yaml
  - ingressroute.yaml
configMapGenerator:
  - name: glance-config
    namespace: glance
    files:
      - config/glance.yml
      - config/home.yml
      - config/socials.yml
  - name: glance-assets
    namespace: glance
    files:
      - assets/user.css