apiVersion: v1
kind: PersistentVolume
metadata:
  name: karakeep-data
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 192.168.0.104
    path: /mnt/data/config/karakeep/karakeep-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: karakeep-meili
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, noatime]
  nfs:
    server: 192.168.0.104
    path: /mnt/data/config/karakeep/meilisearch-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data
  namespace: karakeep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: karakeep-data
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-meili
  namespace: karakeep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: karakeep-meili
  resources: {requests: {storage: 1Gi}}