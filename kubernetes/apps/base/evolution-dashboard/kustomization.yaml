apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: evolution-dashboard
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
configMapGenerator:
  - name: evolution-dashboard-config
    files:
      - config.yaml
labels:
  - pairs:
      app.kubernetes.io/name: evolution-dashboard
    includeSelectors: false
