---
apiVersion: v1
kind: Service
metadata: { name: norish-valkey, namespace: norish }
spec:
  selector: { app: norish-valkey }
  ports: [{ name: valkey, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: norish-valkey, namespace: norish }
spec:
  serviceName: norish-valkey
  replicas: 1
  selector: { matchLabels: { app: norish-valkey } }
  template:
    metadata: { labels: { app: norish-valkey } }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9
          args: [valkey-server, --appendonly, "yes", --maxmemory-policy, noeviction]
          ports: [{ name: valkey, containerPort: 6379 }]
          readinessProbe:
            exec: { command: [valkey-cli, ping] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
