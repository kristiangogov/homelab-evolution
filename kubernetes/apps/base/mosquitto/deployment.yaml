---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mosquitto, namespace: mqtt }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mosquitto } }
  template:
    metadata: { labels: { app: mosquitto } }
    spec:
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
      initContainers:
      - name: init-passwd
        image: busybox:1.37
        command: [ "sh", "-c", "cp /src/passwd /dst/passwd && chmod 0600 /dst/passwd" ]
        volumeMounts:
        - { name: passwd-src, mountPath: /src, readOnly: true }
        - { name: passwd, mountPath: /dst }
      containers:
      - name: mosquitto
        volumeMounts:
        - { name: config, mountPath: /mosquitto/config, readOnly: true }
        - { name: passwd, mountPath: /mosquitto/secret }
      volumes:
      - name: config
        configMap: { name: mosquitto-config }
      - name: passwd-src
        secret: { secretName: mosquitto-passwd, defaultMode: 444 }
      - name: passwd
        emptyDir: {}
