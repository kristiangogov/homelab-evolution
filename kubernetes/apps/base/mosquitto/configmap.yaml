---
apiVersion: v1
kind: ConfigMap
metadata: { name: mosquitto-config, namespace: mqtt }
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    password_file /mosquitto/secret/passwd
    acl_file /mosquitto/config/acl
    persistence false
    log_dest stdout
  acl: |
    user frigate
    topic readwrite frigate/#

    user frigate-notify
    topic read frigate/#
