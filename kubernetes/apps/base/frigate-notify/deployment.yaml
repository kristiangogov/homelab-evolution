---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frigate-notify, namespace: frigate }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: frigate-notify } }
  template:
    metadata: { labels: { app: frigate-notify } }
    spec:
      containers:
      - name: frigate-notify
        image: ghcr.io/0x2142/frigate-notify:v0.5.4
        env:
        - { name: TZ, value: Europe/Sofia }
        volumeMounts:
        - { name: config, mountPath: /app/config.yml, subPath: config.yml, readOnly: true }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
      volumes:
      - name: config
        secret: { secretName: frigate-notify-config }
