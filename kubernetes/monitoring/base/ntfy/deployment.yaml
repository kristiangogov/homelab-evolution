---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ntfy, namespace: ntfy }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: ntfy } }
  template:
    metadata: { labels: { app: ntfy } }
    spec:
      containers:
      - name: ntfy
        image: binwiederhier/ntfy:v2.37.2
        args: [ serve ]
        envFrom:
        - configMapRef: { name: ntfy-config }
        - secretRef: { name: ntfy-secrets }
        ports: [ { name: http, containerPort: 80 } ]
        readinessProbe:
          httpGet: { path: /v1/health, port: http }
        livenessProbe:
          httpGet: { path: /v1/health, port: http }
          initialDelaySeconds: 10
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
