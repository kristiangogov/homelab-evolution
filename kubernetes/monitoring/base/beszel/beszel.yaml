---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beszel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beszel
    spec:
      containers:
        - name: beszel
          image: henrygd/beszel:latest # On purpose
          env:
            - name: APP_URL
              value: https://beszel.internal.gogov.dev
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: data
              mountPath: /beszel_data
          readinessProbe:
            exec:
              command: ["/beszel", "health", "--url", "http://localhost:8090"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/beszel", "health", "--url", "http://localhost:8090"]
            initialDelaySeconds: 30
            periodSeconds: 120
            timeoutSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-data
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi            

---
apiVersion: v1
kind: Service
metadata:
  name: beszel
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel
spec:
  selector:
    app.kubernetes.io/name: beszel
  ports:
    - name: http
      port: 8090
      targetPort: http