---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: infisical
  namespace: infisical
spec:
  interval: 1h
  url: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: infisical
spec:
  interval: 30m
  chart:
    spec:
      chart: infisical-standalone
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: infisical
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: infisical
    infisical:
      image:
        repository: infisical/infisical
        tag: "v0.167.4"
    postgresql:
      enabled: false
    redis:
      enabled: false
    ingress:
      enabled: false
      nginx:
        enabled: false