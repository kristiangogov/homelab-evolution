services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXTAUTH_URL: "https://karakeep.gogov.dev"
      MEILI_ADDR: "http://meilisearch:7700"
      BROWSER_WEB_URL: "http://chrome:9222"
      DATA_DIR: "/data"
      KARAKEEP_VERSION: "release"
      MEILI_NO_ANALYTICS: "true"
    env_file:
      - .env
    volumes:
      - /mnt/nas_config/karakeep/karakeep-data:/data
    networks:
      - homelab
    depends_on:
      - meilisearch
      - chrome

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
    env_file:
      - .env
    volumes:
      - /mnt/nas_config/karakeep/meilisearch-data:/meili_data
    networks:
      - homelab

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: chrome
    restart: unless-stopped
    init: true
    command:
      - chromium-browser
      - --headless
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
    networks:
      - homelab

networks:
  homelab:
    external: true