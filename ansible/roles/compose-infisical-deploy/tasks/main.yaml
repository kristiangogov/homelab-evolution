---
- name: Fail if service var not provided
  ansible.builtin.fail:
    msg: "You must pass -e service=<name>"
  when: service is not defined

- name: Load service-specific vars if present
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../../docker/{{ service }}/vars.yaml"
  when: (playbook_dir + '/../../../docker/' + service + '/vars.yaml') is exists

- name: Infisical login
  ansible.builtin.command: >
    infisical login --method=universal-auth
    --domain {{ infisical_url }} --plain --silent
  environment:
    INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: "{{ vault_infisical_client_id }}"
    INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: "{{ vault_infisical_client_secret }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: infisical_login
  changed_when: false
  no_log: true

- name: Export secrets from Infisical
  ansible.builtin.command: >
    infisical export --domain {{ infisical_url }}
    --projectId {{ infisical_project_id }} --env {{ infisical_env }}
    --path /{{ service }} --format dotenv
  environment:
    INFISICAL_TOKEN: "{{ infisical_login.stdout }}"
  delegate_to: localhost
  become: false
  register: service_secrets
  changed_when: false
  no_log: true

- name: Ensure remote service directory exists
  ansible.builtin.file:
    path: "/opt/homelab/{{ service }}"
    state: directory
    mode: "0755"

- name: Copy service files to host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../docker/{{ service }}/"
    dest: "/opt/homelab/{{ service }}/"
    mode: preserve

- name: Render .env from Infisical
  ansible.builtin.copy:
    content: "{{ service_secrets.stdout }}\n"
    dest: "/opt/homelab/{{ service }}/.env"
    mode: "0600"
  no_log: true

- name: Set ownership on service directory (if defined)
  ansible.builtin.file:
    path: "/opt/homelab/{{ service }}"
    owner: "{{ service_owner_uid }}"
    group: "{{ service_owner_gid }}"
    recurse: true
  when: service_owner_uid is defined and service_owner_gid is defined

- name: Run docker compose up
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "/opt/homelab/{{ service }}"
  register: compose_result
  changed_when: >
    'Started' in compose_result.stderr or
    'Created' in compose_result.stderr or
    'Recreated' in compose_result.stderr