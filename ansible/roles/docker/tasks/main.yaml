---
- name: Include OS-family repo setup
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] | lower }}.yaml"

- name: Install Docker packages
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add ansible_user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  register: docker_group_add

- name: Notify if re-login required
  ansible.builtin.debug:
    msg: "{{ ansible_user }} was added to the docker group. Log out/in (or reconnect SSH) for it to take effect."
  when: docker_group_add.changed

- name: Ensure 'homelab' Docker network exists
  community.docker.docker_network:
    name: homelab
    state: present