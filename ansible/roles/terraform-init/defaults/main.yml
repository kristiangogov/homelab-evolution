---
terraform_init_storage: local
terraform_init_storage_content: [iso, vztmpl, backup, snippets, import]

terraform_init_role: Terraform
terraform_init_privs:
  - Datastore.Allocate
  - Datastore.Audit
  - Datastore.AllocateSpace
  - Datastore.AllocateTemplate
  - Pool.Allocate
  - SDN.Use
  - Sys.Audit
  - Sys.Console
  - Sys.Modify
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.Cloudinit
  - VM.Config.CPU
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.Migrate
  - VM.PowerMgmt
  - VM.Console
  - VM.GuestAgent.Audit

terraform_init_user: terraform@pve
terraform_init_token_name: provider
# Delete and recreate the token if it exists (value is only shown at creation)
terraform_init_token_rotate: false

# Workstation prep (runs against the controller / Proxmox root authorized_keys)
terraform_init_workstation_prep: true
terraform_init_ssh_pubkey: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
