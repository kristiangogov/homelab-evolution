---
restic_repository: /mnt/nas_backup/restic-lab
restic_password: "{{ vault_restic_password }}"

restic_config_dir: /etc/restic
restic_staging_dir: /var/backups/restic-staging

restic_backup_paths:
  - /mnt/nas_config/karakeep
  - /mnt/nas_config/silverbullet

restic_pg_container: postgres
restic_pg_dumps:
  - { user: docmost, db: docmost }
  - { user: kaneo, db: kaneo }

restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 6

restic_timer_oncalendar: "*-*-* 03:00:00"
restic_requires_mounts:
  - /mnt/nas_backup
  - /mnt/nas_config
